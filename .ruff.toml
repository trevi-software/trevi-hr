
target-version = "py310"
fix = true

[lint]
# ruff's own default rule set widened enormously in the 0.1x series (v0.16
# enables 429 rules across ~38 prefixes). The selection below was written
# against the previous default of E4/E7/E9/F, so pin that explicitly instead
# of inheriting whatever a future ruff release decides to turn on.
select = ["E4", "E7", "E9", "F"]
extend-select = [
    "B",
    "C90",
    "E501",  # line too long (default 88)
    "I",  # isort
    "UP",  # pyupgrade
]
extend-safe-fixes = ["UP008"]
exclude = ["setup/*"]

[format]
exclude = ["setup/*"]

[lint.per-file-ignores]
"__init__.py" = ["F401", "I001"]  # ignore unused and unsorted imports in __init__.py
"__manifest__.py" = ["B018"]  # useless expression

[lint.isort]
section-order = ["future", "standard-library", "third-party", "odoo", "odoo-addons", "first-party", "local-folder"]

[lint.isort.sections]
"odoo" = ["odoo"]
"odoo-addons" = ["odoo.addons"]

[lint.mccabe]
max-complexity = 16
