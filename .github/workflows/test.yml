name: tests

on:
  pull_request:
    branches:
      - "18.0*"
  push:
    branches:
      - "18.0"
      - "18.0-ocabot-*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unreleased-deps:
    runs-on: ubuntu-latest
    name: Detect unreleased dependencies
    steps:
      - uses: actions/checkout@v4
      - run: |
          for reqfile in requirements.txt test-requirements.txt ; do
              if [ -f ${reqfile} ] ; then
                  result=0
                  # reject non-comment lines that contain a / (i.e. URLs, relative paths)
                  grep "^[^#].*/" ${reqfile} || result=$?
                  if [ $result -eq 0 ] ; then
                      echo "Unreleased dependencies found in ${reqfile}."
                      exit 1
                  fi
              fi
          done
  test:
    runs-on: ubuntu-22.04
    container: ${{ matrix.container }}
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - container: ghcr.io/oca/oca-ci/py3.10-odoo18.0:latest
            name: test with Odoo
          - container: ghcr.io/oca/oca-ci/py3.10-ocb18.0:latest
            name: test with OCB
            makepot: "true"
    services:
      postgres:
        image: postgres:12
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: odoo
        ports:
          - 5432:5432
    env:
      OCA_ENABLE_CHECKLOG_ODOO: "1"
      # Cross-repo addon dependencies, see the step below and issue #123.
      TREVI_PAYROLL_REPO: trevi-software/trevi-payroll
      TREVI_PAYROLL_REF: "18.0"
      # Build the addons at their plain manifest version. Without this, whool
      # derives a post-release segment from the git history, which actions/checkout
      # does not fetch (it clones with depth 1).
      WHOOL_POST_VERSION_STRATEGY_OVERRIDE: none
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Three addons in this repo (hr_data_import, hr_employee_wizard and
      # payroll_salary_code_hr) depend on addons that live in
      # trevi-software/trevi-payroll. oca_install_addons turns every out-of-repo
      # addon dependency into an `odoo-addon-<name>==18.0.*` requirement and
      # installs it from the OCA wheelhouse, where these addons do not exist.
      # Declaring them here as direct URL requirements takes priority:
      # oca_list_addons_to_test_as_url_reqs skips addons that already have a URL
      # requirement, and oca_install_addons appends its own computed requirements
      # to this same file and installs the lot in one resolution pass. The
      # trevi-hr addons these depend on are pulled back to this checkout by the
      # test-constraints.txt that oca_install_addons generates.
      #
      # This has to be a workflow step rather than a committed test-requirements.txt
      # because the `Detect unreleased dependencies` job rejects URL lines there.
      #
      # See https://github.com/trevi-software/trevi-hr/issues/123
      - name: Declare trevi-payroll dependencies as git requirements
        run: |
          for addon in \
              payroll_default_salary_rules \
              payroll_period_contract_values \
              payroll_periods \
              payroll_policy_absence \
              payroll_policy_accrual \
              payroll_policy_group \
              payroll_policy_ot \
              payroll_policy_presence \
              payroll_policy_rounding \
              payroll_salary_code \
          ; do
            echo "odoo-addon-${addon} @ git+https://github.com/${TREVI_PAYROLL_REPO}@${TREVI_PAYROLL_REF}#subdirectory=${addon}"
          done >> test-requirements.txt
          # pdfminer.six: optional dep of core attachment_indexation; without it
          # a WARNING lands in the Odoo log and the checklog step fails the run.
          echo "pdfminer.six" >> test-requirements.txt
          cat test-requirements.txt
      - name: Install addons and dependencies
        run: oca_install_addons
      - name: Check licenses
        run: manifestoo -d . check-licenses
      - name: Check development status
        run: manifestoo -d . check-dev-status --default-dev-status=Beta
      - name: Initialize test db
        run: oca_init_test_database
      - name: Run tests
        run: oca_run_tests
      - name: Upload screenshots from JS tests
        uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: Screenshots of failed JS tests - ${{ matrix.name }}${{ join(matrix.include) }}
          path: /tmp/odoo_tests/${{ env.PGDATABASE }}
          if-no-files-found: ignore
      - uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Update .pot files
        run: oca_export_and_push_pot https://x-access-token:${{ secrets.GIT_PUSH_TOKEN }}@github.com/${{ github.repository }}
        if: ${{ matrix.makepot == 'true' && github.event_name == 'push' && github.repository_owner == 'trevi-software' }}
